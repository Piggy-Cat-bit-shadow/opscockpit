name: build

# Manual build only. Never runs on push, never scheduled, no auto upstream
# sync, no dependency rebuilds.
#
#   workflow_dispatch inputs:
#     rebuild_frontend: false (default) → skip Node/Vite; only
#                                          setup-go + go test + vet + build
#                       true             → also setup-node, npm ci,
#                                          typecheck, vitest, vite build,
#                                          verify committed dist in sync
#
# Outputs a single linux/amd64 artifact. There is deliberately NO deploy job,
# no SSH, no SCP, no rsync, and no server credentials of any kind. The
# workflow stops at artifact generation.
on:
  workflow_dispatch:
    inputs:
      rebuild_frontend:
        type: boolean
        default: false
        description: 'Rebuild the frontend and refresh the committed dist'
      version_tag:
        type: string
        default: ''
        description: 'Version string baked into the binary (e.g. v1.0.0)'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -timeout 120s ./...

      - name: Rebuild frontend (optional)
        if: ${{ inputs.rebuild_frontend }}
        run: ./scripts/check-frontend-dist.sh --fix

      - name: Verify frontend dist in sync
        run: ./scripts/check-frontend-dist.sh

      - name: Build linux/amd64
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          VERSION="${VERSION_TAG:-dev}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags "-s -w -X github.com/opscockpit/opscockpit/internal/version.Version=${VERSION}" \
            -o dist/opscockpit ./cmd/opscockpit

      - name: Stage artifact files
        run: |
          mkdir -p dist
          cp dist/opscockpit dist/opscockpit-linux-amd64
          cp configs/services.example.yaml dist/services.example.yaml
          cp README.md dist/README.md
          cp ARCHITECTURE.md dist/ARCHITECTURE.md
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          cp LICENSE dist/LICENSE
          # sha256 + tar.gz
          (cd dist && shasum -a 256 opscockpit-linux-amd64 > opscockpit-linux-amd64.sha256)
          tar -czf dist/opscockpit-linux-amd64.tar.gz \
            -C dist \
            opscockpit-linux-amd64 \
            opscockpit-linux-amd64.sha256 \
            services.example.yaml \
            README.md \
            ARCHITECTURE.md \
            THIRD_PARTY_NOTICES.md \
            LICENSE

      - name: Show artifact sizes
        run: |
          ls -la dist/
          echo "---"
          ./dist/opscockpit-linux-amd64 version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opscockpit-linux-amd64
          path: |
            dist/opscockpit-linux-amd64
            dist/opscockpit-linux-amd64.sha256
            dist/opscockpit-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 30
